<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}{{ if not .IsHome }} — {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.intro }}{{ . | plainify }}{{ else }}{{ .Summary }}{{ end }}{{ end }}">
  <link rel="stylesheet" href="/css/dhh.css">
  {{ with site.Params.favicon }}<link rel="icon" href="{{ . }}">{{ end }}

  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="{{ .Lang }}">
  {{ with .Params.avatar }}<meta property="og:image" content="{{ . | absURL }}">{{ end }}
  {{ range .Translations }}
  <link rel="alternate" hreflang="{{ .Lang }}" href="{{ .Permalink }}">
  {{ end }}
</head>
<body class="{{ if .IsHome }}home{{ else }}post{{ end }}">
  {{ if and .IsHome (eq .Lang "ru") }}
  <script>
  (function() {
    if (!sessionStorage.getItem("lang_checked")) {
      sessionStorage.setItem("lang_checked", "1");
      var lang = (navigator.language || navigator.userLanguage || "").toLowerCase();
      if (!lang.startsWith("ru")) {
        window.location.replace("/en/");
      }
    }
  })();
  </script>
  {{ end }}

  {{- partial "header.html" . -}}

  <article>
    {{- block "main" . }}{{- end }}
  </article>

  {{- partial "footer.html" . -}}
</body>
</html>
